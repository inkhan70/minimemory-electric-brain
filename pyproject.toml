[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minimemory"
version = "0.8.0"
description = "Offline-first SQLite memory layer for local AI applications."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Developer" }]
license = { text = "MIT" }
keywords = ["memory", "ai", "llm", "offline", "sqlite", "semantic-search", "knowledge-graph", "rag", "verification", "text-pipeline", "federated-memory", "answer-framing"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Operating System :: OS Independent"]
dependencies = []

[project.optional-dependencies]
semantic = ["torch>=2.0.0", "sentence-transformers>=2.2.0"]
hub = ["huggingface_hub>=0.20"]
all = ["torch>=2.0.0", "sentence-transformers>=2.2.0", "huggingface_hub>=0.20"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "build>=1.0", "twine>=4.0"]

[project.scripts]
minimemory = "minimemory.cli:main"

[tool.setuptools.packages.find]
include = ["minimemory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
